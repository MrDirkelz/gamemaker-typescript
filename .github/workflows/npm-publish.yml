name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish tag (prod or beta)'
        required: true
        type: choice
        options:
          - prod
          - beta
      npm_version:
        description: 'NPM version to publish (e.g. 1.2.3 or 1.2.3-beta.1)'
        required: true
        type: string

  push:
    tags:
      - 'v*'

  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      npm_version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # REQUIRED for npm Trusted Publishing

jobs:
  gamemaker-lts-gate:
    runs-on: [self-hosted, gamemaker-lts-2026]
    env:
      GMTS_GAMEMAKER_CLI: ${{ vars.GMTS_GAMEMAKER_CLI }}
      GMTS_GAMEMAKER_PROJECT: ${{ vars.GMTS_GAMEMAKER_PROJECT }}
      GMTS_GAMEMAKER_ARGS_JSON: ${{ vars.GMTS_GAMEMAKER_ARGS_JSON }}
      GMTS_GAMEMAKER_RUNTIME_VERSION: '2026.0.0.23'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - name: Compile generated project with licensed GameMaker LTS
        run: npm run test:gamemaker

  publish:
    needs: gamemaker-lts-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release
        run: npm run verify

      - name: Determine tag and set NPM version
        id: release-meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="prod"
            echo "Push event detected, skipping npm version set"
          else
            TAG="${{ inputs.tag }}"
            echo "Setting npm version to ${{ inputs.npm_version }}"
            npm version "${{ inputs.npm_version }}" --no-git-tag-version --allow-same-version
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          if [ "${{ steps.release-meta.outputs.tag }}" = "beta" ]; then
            npm publish --tag beta --access public
          else
            npm publish --access public
          fi
